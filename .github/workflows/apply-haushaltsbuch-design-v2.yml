name: Apply Haushaltsbuch design v2

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/apply-haushaltsbuch-design-v2.yml"

permissions:
  contents: write

jobs:
  apply-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Apply design-only changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path('app/src/main/java/de/galeriesync/MainActivity.kt')
          text = main_path.read_text()

          old_theme = '''private val Navy=Color(0xFF071A27);private val Panel=Color(0xFF102A3A);private val Panel2=Color(0xFF17384B)
          private val Blue=Color(0xFF3DA5FF);private val Green=Color(0xFF42D77D);private val Muted=Color(0xFF9CB1BF)
          private val Scheme=darkColorScheme(primary=Blue,onPrimary=Color.White,background=Navy,surface=Panel,surfaceVariant=Panel2,onBackground=Color.White,onSurface=Color.White,onSurfaceVariant=Color.White,outline=Color(0xFF345568))
          private val LightScheme=lightColorScheme(primary=Color(0xFF0878C9),onPrimary=Color.White,background=Color(0xFFF3F7FA),surface=Color.White,surfaceVariant=Color(0xFFE3EEF5),onBackground=Color(0xFF10212C),onSurface=Color(0xFF10212C),onSurfaceVariant=Color(0xFF405665),outline=Color(0xFF78909C))'''
          new_theme = '''private val Scheme=darkColorScheme(
           primary=Color(0xFF5B9CFF),onPrimary=Color.White,
           primaryContainer=Color(0xFF1B2A44),onPrimaryContainer=Color(0xFF8FB4E8),
           secondary=Color(0xFF2ED991),onSecondary=Color(0xFF0F1013),
           background=Color(0xFF484F5A),surface=Color(0xFF1E1F24),surfaceVariant=Color(0xFF24252B),
           onBackground=Color(0xFFF2F2F4),onSurface=Color(0xFFF2F2F4),onSurfaceVariant=Color(0xFFA9ABB2),
           outline=Color(0xFF45464E),error=Color(0xFFFF5B42)
          )
          private val LightScheme=lightColorScheme(
           primary=Color(0xFF1268FF),onPrimary=Color.White,
           primaryContainer=Color(0xFFE3EDFF),onPrimaryContainer=Color(0xFF0D3C8C),
           secondary=Color(0xFF00A971),onSecondary=Color.White,
           background=Color(0xFFC4CAD3),surface=Color(0xFFFBFBFC),surfaceVariant=Color(0xFFF2F2F5),
           onBackground=Color(0xFF191A1C),onSurface=Color(0xFF191A1C),onSurfaceVariant=Color(0xFF6E7074),
           outline=Color(0xFFDADADE),error=Color(0xFFF0421F)
          )'''
          if old_theme not in text:
              raise SystemExit('Expected old theme block not found; refusing to touch logic.')
          text = text.replace(old_theme, new_theme, 1)

          replacements = {
              'window.statusBarColor=if(dark)android.graphics.Color.rgb(7,26,39) else android.graphics.Color.rgb(243,247,250)':
                  'window.statusBarColor=if(dark)android.graphics.Color.rgb(15,16,19) else android.graphics.Color.rgb(242,242,245)',
              'window.navigationBarColor=if(dark)android.graphics.Color.rgb(9,31,45) else android.graphics.Color.WHITE':
                  'window.navigationBarColor=if(dark)android.graphics.Color.rgb(30,31,36) else android.graphics.Color.WHITE',
              'MaterialTheme(colorScheme=if(dark)Scheme else LightScheme){':
                  'MaterialTheme(colorScheme=if(dark)Scheme else LightScheme,shapes=Shapes(small=RoundedCornerShape(10.dp),medium=RoundedCornerShape(14.dp),large=RoundedCornerShape(18.dp))){',
              'Scaffold(containerColor=MaterialTheme.colorScheme.background,':
                  'Scaffold(containerColor=Color.Transparent,',
              '@Composable private fun CardBox(content:@Composable ColumnScope.()->Unit){Card(Modifier.fillMaxWidth(),shape=RoundedCornerShape(16.dp),colors=CardDefaults.cardColors(containerColor=MaterialTheme.colorScheme.surface),content={Column(Modifier.padding(16.dp),content=content)})}':
                  '@Composable private fun CardBox(content:@Composable ColumnScope.()->Unit){Card(Modifier.fillMaxWidth(),shape=RoundedCornerShape(14.dp),colors=CardDefaults.cardColors(containerColor=MaterialTheme.colorScheme.surface),elevation=CardDefaults.cardElevation(defaultElevation=6.dp),content={Column(Modifier.padding(16.dp),content=content)})}',
              'NavigationBar(containerColor=MaterialTheme.colorScheme.surface)':
                  'NavigationBar(containerColor=MaterialTheme.colorScheme.surface,tonalElevation=0.dp)',
              'label={Text(t.label,fontSize=10.sp)})':
                  'label={Text(t.label,fontSize=10.sp)},colors=NavigationBarItemDefaults.colors(selectedIconColor=MaterialTheme.colorScheme.onPrimaryContainer,selectedTextColor=MaterialTheme.colorScheme.onPrimaryContainer,indicatorColor=MaterialTheme.colorScheme.primaryContainer,unselectedIconColor=MaterialTheme.colorScheme.onSurfaceVariant,unselectedTextColor=MaterialTheme.colorScheme.onSurfaceVariant))',
              'Color(0xFF17466A)': 'MaterialTheme.colorScheme.primaryContainer',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected design token not found: {old[:70]}')
              text = text.replace(old, new)

          for old, new in (
              ('Panel2', 'MaterialTheme.colorScheme.surfaceVariant'),
              ('Panel', 'MaterialTheme.colorScheme.surface'),
              ('Green', 'MaterialTheme.colorScheme.secondary'),
              ('Muted', 'MaterialTheme.colorScheme.onSurfaceVariant'),
              ('Blue', 'MaterialTheme.colorScheme.primary'),
          ):
              text = text.replace(old, new)

          text = text.replace('RoundedCornerShape(16.dp)', 'RoundedCornerShape(14.dp)')
          text = text.replace('RoundedCornerShape(24.dp)', 'RoundedCornerShape(18.dp)')

          text = text.replace('Text("Synchronisiere …",fontSize=24.sp,fontWeight=FontWeight.Bold,color=Color.White)', 'Text("Synchronisiere …",fontSize=24.sp,fontWeight=FontWeight.Bold,color=MaterialTheme.colorScheme.onBackground)')
          text = text.replace('Text("↻",fontSize=54.sp,color=Color.White)', 'Text("↻",fontSize=54.sp,color=MaterialTheme.colorScheme.primary)')
          text = text.replace('Text(file.ifBlank{status.ifBlank{"Verbindung wird vorbereitet …"}},color=Color.White,fontWeight=FontWeight.SemiBold)', 'Text(file.ifBlank{status.ifBlank{"Verbindung wird vorbereitet …"}},color=MaterialTheme.colorScheme.onSurface,fontWeight=FontWeight.SemiBold)')
          text = text.replace('Text("Lokale Daten",color=Color.White,fontWeight=FontWeight.Bold)', 'Text("Lokale Daten",color=MaterialTheme.colorScheme.onSurface,fontWeight=FontWeight.Bold)')
          text = text.replace('Text("GalerieSync",color=Color.White,fontWeight=FontWeight.Bold,fontSize=20.sp)', 'Text("GalerieSync",color=MaterialTheme.colorScheme.onSurface,fontWeight=FontWeight.Bold,fontSize=20.sp)')
          text = text.replace('Text("Heim-WLANs",color=Color.White,fontWeight=FontWeight.Bold,fontSize=18.sp)', 'Text("Heim-WLANs",color=MaterialTheme.colorScheme.onSurface,fontWeight=FontWeight.Bold,fontSize=18.sp)')
          text = text.replace('Text("FRITZ!Box VPN",color=Color.White,fontWeight=FontWeight.Bold,fontSize=18.sp)', 'Text("FRITZ!Box VPN",color=MaterialTheme.colorScheme.onSurface,fontWeight=FontWeight.Bold,fontSize=18.sp)')
          text = text.replace('Text(ssid,Modifier.weight(1f),color=Color.White)', 'Text(ssid,Modifier.weight(1f),color=MaterialTheme.colorScheme.onSurface)')
          text = text.replace('Text(t,Modifier.weight(1f),fontWeight=FontWeight.SemiBold,color=Color.White)', 'Text(t,Modifier.weight(1f),fontWeight=FontWeight.SemiBold,color=if(on)MaterialTheme.colorScheme.onPrimaryContainer else MaterialTheme.colorScheme.onSurface)')

          main_path.write_text(text)

          gallery_path = Path('app/src/main/java/de/galeriesync/gallery/GalleryScreen.kt')
          gallery = gallery_path.read_text()
          gallery_replacements = {
              'Column(Modifier.fillMaxSize().background(MaterialTheme.colorScheme.background)){':
                  'Column(Modifier.fillMaxSize()){',
              'Surface(shape=RoundedCornerShape(20.dp),color=MaterialTheme.colorScheme.surface){':
                  'Surface(shape=RoundedCornerShape(18.dp),color=MaterialTheme.colorScheme.surface,shadowElevation=14.dp){',
              'Card(Modifier.aspectRatio(1f).clickable{onClick()},shape=RoundedCornerShape(12.dp)){':
                  'Card(Modifier.aspectRatio(1f).clickable{onClick()},shape=RoundedCornerShape(14.dp)){',
              'Card(Modifier.aspectRatio(1f).clickable{onClick()},shape=RoundedCornerShape(10.dp)){':
                  'Card(Modifier.aspectRatio(1f).clickable{onClick()},shape=RoundedCornerShape(14.dp)){',
          }
          for old, new in gallery_replacements.items():
              if old not in gallery:
                  raise SystemExit(f'Expected gallery design token not found: {old}')
              gallery = gallery.replace(old, new, 1)
          gallery_path.write_text(gallery)
          print('Design-only patch applied.')
          PY

      - name: Verify no functional files changed
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'app/src/main/java/de/galeriesync/MainActivity.kt\napp/src/main/java/de/galeriesync/gallery/GalleryScreen.kt'

      - name: Compile modified app
        shell: bash
        run: gradle assembleDebug

      - name: Commit verified design update and remove helper workflows
        shell: bash
        run: |
          git config user.name "GalerieSync Design Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-haushaltsbuch-design.yml .github/workflows/apply-haushaltsbuch-design-v2.yml
          git add app/src/main/java/de/galeriesync/MainActivity.kt app/src/main/java/de/galeriesync/gallery/GalleryScreen.kt
          git commit -m "Match GalerieSync design to Haushaltsbuch"
          git push origin main
