name: Apply gallery pre-index performance
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/apply-gallery-preindex-performance.yml' ]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/apply_gallery_preindex_performance.py
      - run: |
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add app/src/main/java/de/galeriesync/gallery/GalleryRepository.kt app/src/main/java/de/galeriesync/gallery/GalleryScreen.kt
          git diff --cached --check
          git commit -m "Pre-index gallery folder previews"
          rm tools/apply_gallery_preindex_performance.py .github/workflows/apply-gallery-preindex-performance.yml
          git add -A
          git commit --amend --no-edit
          git push
