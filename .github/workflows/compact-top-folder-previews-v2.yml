          m=Path('app/src/main/java/de/galeriesync/MainActivity.kt')
          t=m.read_text()
          oldtop='Scaffold(containerColor=Color.Transparent,topBar={Row(Modifier.fillMaxWidth().padding(top=10.dp,start=28.dp,end=28.dp,bottom=10.dp),horizontalArrangement=Arrangement.End){IconButton(onClick={settingsPage="ROOT"},modifier=Modifier.offset(x=(-4).dp)){Text("⚙",fontSize=24.sp,color=MaterialTheme.colorScheme.onSurface)}}}'
          newtop='Scaffold(containerColor=Color.Transparent,topBar={Row(Modifier.fillMaxWidth().padding(top=0.dp,start=28.dp,end=28.dp,bottom=0.dp),horizontalArrangement=Arrangement.End){IconButton(onClick={settingsPage="ROOT"},modifier=Modifier.size(38.dp).offset(x=(-4).dp)){Text("⚙",fontSize=24.sp,color=MaterialTheme.colorScheme.onSurface)}}}'
          assert oldtop in t, 'top bar not found'
          t=t.replace(oldtop,newtop,1)
          oldh='@Composable private fun Header(t:String,s:String?=null){Column(Modifier.fillMaxWidth().padding(20.dp,18.dp,20.dp,10.dp)){Text(t,fontSize=25.sp,fontWeight=FontWeight.Bold,color=MaterialTheme.colorScheme.onBackground);s?.let{Text(it,color=MaterialTheme.colorScheme.onSurfaceVariant,fontSize=13.sp)}}}'
          newh='@Composable private fun Header(t:String,s:String?=null){Column(Modifier.fillMaxWidth().padding(start=20.dp,top=2.dp,end=20.dp,bottom=8.dp)){Text(t,fontSize=25.sp,fontWeight=FontWeight.Bold,color=MaterialTheme.colorScheme.onBackground);s?.let{Text(it,color=MaterialTheme.colorScheme.onSurfaceVariant,fontSize=13.sp)}}}'
          assert oldh in t, 'header helper not found'
          t=t.replace(oldh,newh,1)
          m.write_text(t)
          PY
          printf 'GalerieSync 0.4.8: compact headers and folder previews\n' > .github/build-trigger
          rm -f .github/workflows/compact-top-folder-previews.yml .github/workflows/compact-top-folder-previews-v2.yml
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Compact headers and add gallery folder previews'
          git push
