name: Build APK
on:
  push:
    branches: [ "main", "master" ]
    paths:
      - ".github/build-trigger"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Restore stable debug keystore
        env:
          GALERIESYNC_DEBUG_KEYSTORE: ${{ secrets.GALERIESYNC_DEBUG_KEYSTORE }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$GALERIESYNC_DEBUG_KEYSTORE" ]; then
            echo "$GALERIESYNC_DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          else
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=GalerieSync Debug,O=GalerieSync,C=DE"
            echo "::warning::GALERIESYNC_DEBUG_KEYSTORE secret is not configured. This build created a new key and will not provide stable update signatures."
          fi
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GalerieSync-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
