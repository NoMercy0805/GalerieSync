name: Build APK
on:
  push:
    branches: [ "main", "master" ]
    paths:
      - ".github/build-trigger"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Apply requested UI patch once
        if: contains(github.event.head_commit.message, 'compact headers and folder previews')
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          g=Path('app/src/main/java/de/galeriesync/gallery/GalleryScreen.kt')
          s=g.read_text()
          s=s.replace('''        Row(Modifier.fillMaxWidth().padding(horizontal=18.dp,vertical=6.dp),verticalAlignment=Alignment.CenterVertically){
