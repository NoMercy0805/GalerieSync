name: Build APK
on:
  push:
    branches: [ "main", "master", "fix/sync-skip-existing" ]
    paths:
      - ".github/build-trigger"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Restore stable debug keystore
        env:
          GALERIESYNC_DEBUG_KEYSTORE: ${{ secrets.GALERIESYNC_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$GALERIESYNC_DEBUG_KEYSTORE" ]; then
            echo "::error::GALERIESYNC_DEBUG_KEYSTORE is missing. Refusing to create an APK with a temporary signing key."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          echo "$GALERIESYNC_DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          FINGERPRINT=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep "SHA1:" | awk '{print $2}')
          echo "Signing key SHA1: $FINGERPRINT"
          EXPECTED="62:2C:81:31:BD:82:81:AF:DB:AB:FC:4E:DA:8D:41:33:29:C5:E5:10"
          if [ "$FINGERPRINT" != "$EXPECTED" ]; then
            echo "::error::Keystore fingerprint mismatch! Expected $EXPECTED but got $FINGERPRINT. Refusing to build with the wrong signing key."
            exit 1
          fi
          echo "Signing key verified against expected fingerprint."

      - name: Build debug APK
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build-output.log
        continue-on-error: true

      - name: Commit build log on failure
        if: steps.build.outcome == 'failure'
        run: |
          cp build-output.log build-error.log
          git config user.name "CI Diagnostics"
          git config user.email "ci@example.com"
          git add build-error.log
          git commit -m "CI: build error log [skip ci]"
          git push

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "::error::APK not found"; exit 1; }
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER" || { echo "::error::apksigner not found"; exit 1; }
          CERT_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERT_OUTPUT"
          APK_SHA1=$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/^.*certificate SHA-1 digest: //p' | head -1 | tr '[:lower:]' '[:upper:]')
          APK_FINGERPRINT=$(echo "$APK_SHA1" | sed 's/../&:/g;s/:$//')
          echo "APK signature SHA1: $APK_FINGERPRINT"
          EXPECTED="62:2C:81:31:BD:82:81:AF:DB:AB:FC:4E:DA:8D:41:33:29:C5:E5:10"
          if [ -z "$APK_FINGERPRINT" ] || [ "$APK_FINGERPRINT" != "$EXPECTED" ]; then
            echo "::error::APK signature does not match the expected key! Expected $EXPECTED but got $APK_FINGERPRINT."
            exit 1
          fi
          echo "APK signature verified against expected fingerprint."

      - uses: actions/upload-artifact@v4
        with:
          name: GalerieSync-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
