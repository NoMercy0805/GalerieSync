name: Apply Variante C icons
on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/apply-variant-c-icons.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply icon-only design change
        shell: python
        run: |
          from pathlib import Path

          main = Path('app/src/main/java/de/galeriesync/MainActivity.kt')
          text = main.read_text()

          marker = 'import androidx.compose.material3.*\n'
          imports = 'import androidx.compose.material3.*\nimport androidx.compose.material.icons.Icons\nimport androidx.compose.material.icons.rounded.PermMedia\nimport androidx.compose.material.icons.rounded.Storage\n'
          if 'import androidx.compose.material.icons.rounded.PermMedia' not in text:
              if marker not in text:
                  raise SystemExit('material3 import marker not found')
              text = text.replace(marker, imports, 1)

          old = 'Text(t.icon,fontSize=20.sp,color=if(selected)MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.onSurfaceVariant);Text(t.label,fontSize=10.sp,fontWeight=FontWeight.Bold,color=if(selected)MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.onSurfaceVariant,maxLines=1)'
          new = 'when(t){Tab.GALLERY->Icon(Icons.Rounded.PermMedia,contentDescription="Galerie",modifier=Modifier.size(22.dp),tint=if(selected)MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.onSurfaceVariant);Tab.NAS->Icon(Icons.Rounded.Storage,contentDescription="NAS",modifier=Modifier.size(22.dp),tint=if(selected)MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.onSurfaceVariant);Tab.SYNC->Text(t.icon,fontSize=20.sp,color=if(selected)MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.onSurfaceVariant)};Text(t.label,fontSize=10.sp,fontWeight=FontWeight.Bold,color=if(selected)MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.onSurfaceVariant,maxLines=1)'
          if old not in text:
              raise SystemExit('tab icon block not found')
          text = text.replace(old, new, 1)
          main.write_text(text)

          gradle = Path('app/build.gradle.kts')
          g = gradle.read_text()
          dep_marker = '    implementation("androidx.compose.material3:material3")\n'
          dep = dep_marker + '    implementation("androidx.compose.material:material-icons-extended")\n'
          if 'material-icons-extended' not in g:
              if dep_marker not in g:
                  raise SystemExit('material3 dependency marker not found')
              g = g.replace(dep_marker, dep, 1)
              gradle.write_text(g)

          trigger = Path('.github/build-trigger')
          trigger.write_text('GalerieSync 0.4.7: Variante C tab icons\n')

          helper = Path('.github/workflows/apply-variant-c-icons.yml')
          helper.unlink()
      - name: Verify scope
        run: |
          changed=$(git status --short | awk '{print $2}')
          echo "$changed"
          bad=$(echo "$changed" | grep -Ev '^(app/src/main/java/de/galeriesync/MainActivity.kt|app/build.gradle.kts|.github/build-trigger|.github/workflows/apply-variant-c-icons.yml)$' || true)
          test -z "$bad" || { echo "Unexpected files changed: $bad"; exit 1; }
      - name: Commit and push
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add -A
          git commit -m "Use Variante C tab icons"
          git push
