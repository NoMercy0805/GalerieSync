name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Use fixed debug keystore
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Set incrementing version code
        run: |
          sed -i "s/versionCode = [0-9]*/versionCode = ${{ github.run_number }}/" app/build.gradle.kts

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        id: build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build-output.log
        continue-on-error: true

      - name: Commit build log on failure
        if: steps.build.outcome == 'failure'
        run: |
          cp build-output.log build-error.log
          git config user.name "CI Diagnostics"
          git config user.email "ci@example.com"
          git add build-error.log
          git commit -m "CI: build error log [skip ci]"
          git push

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/NasPhotoSync.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NasPhotoSync-APK
          path: app/build/outputs/apk/release/NasPhotoSync.apk
