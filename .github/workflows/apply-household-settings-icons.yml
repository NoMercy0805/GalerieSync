name: Apply Haushaltsbuch-style settings icons
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/apply-household-settings-icons.yml' ]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/apply_household_settings_icons.py
      - run: |
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add app/src/main/java/de/galeriesync/MainActivity.kt
          git diff --cached --check
          git commit -m 'Match settings icons to Haushaltsbuch'
          rm tools/apply_household_settings_icons.py .github/workflows/apply-household-settings-icons.yml
          git add -A
          git commit --amend --no-edit
          git push
