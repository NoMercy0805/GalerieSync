name: Apply gallery VPN refresh
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/apply-gallery-vpn-refresh.yml' ]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/apply_gallery_vpn_refresh.py
      - run: |
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add app/src/main/java/de/galeriesync/gallery/GalleryCacheWorker.kt
          git diff --cached --check
          git commit -m "Use VPN for gallery refresh outside trusted Wi-Fi"
          rm tools/apply_gallery_vpn_refresh.py .github/workflows/apply-gallery-vpn-refresh.yml
          git add -A
          git commit --amend --no-edit
          git push
