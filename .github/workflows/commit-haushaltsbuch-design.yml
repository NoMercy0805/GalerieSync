name: Commit verified Haushaltsbuch design

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/commit-haushaltsbuch-design.yml"

permissions:
  contents: write

jobs:
  commit-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reapply exact compile-verified design patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/apply-haushaltsbuch-design-v3.yml').read_text()
          block = workflow.split("python3 - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          exec(textwrap.dedent(block), {})
          PY

      - name: Verify design-only scope
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'app/src/main/java/de/galeriesync/MainActivity.kt\napp/src/main/java/de/galeriesync/gallery/GalleryScreen.kt'

      - name: Commit design source
        shell: bash
        run: |
          git config user.name "GalerieSync Design Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/de/galeriesync/MainActivity.kt app/src/main/java/de/galeriesync/gallery/GalleryScreen.kt
          git commit -m "Match GalerieSync design to Haushaltsbuch"
          git push origin main
