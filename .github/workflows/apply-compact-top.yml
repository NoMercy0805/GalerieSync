name: Apply compact top layout
on:
  push:
    branches:
      - main
jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Prepare compact top layout patch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch MainActivity
        run: echo '' | base64 -d | python3
      - name: Commit and build
        run: |
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          rm -f .github/workflows/apply-compact-top.yml
          printf 'GalerieSync 0.4.9: compact top and Samsung-style album previews\n' > .github/build-trigger
          git add -A
          git diff --cached --check
          git commit -m 'Compact all tab headers'
          git push
